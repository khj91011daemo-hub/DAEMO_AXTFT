<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팀즈 채널 HTML 협업 편집기</title>

<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"맑은 고딕",Arial,sans-serif;
  background:#f3f5f8;
  color:#222;
  overflow:hidden
}
.app{
  height:100vh;
  display:flex;
  flex-direction:column
}
.topbar{
  height:58px;
  background:#fff;
  border-bottom:1px solid #dfe3e8;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:18px;
  flex:none
}
.title{
  font-size:19px;
  font-weight:700;
  white-space:nowrap;
  color: #464775; /* 팀즈 브랜드 컬러 포인트 */
}
.subtitle{
  font-size:12px;
  color:#777;
  border-left:1px solid #ddd;
  padding-left:18px
}
.actions{
  margin-left:auto;
  display:flex;
  gap:7px;
  align-items:center
}
button{
  font-family:inherit;
  border:1px solid #cfd5dc;
  background:#fff;
  border-radius:5px;
  padding:7px 11px;
  cursor:pointer;
  font-size:13px
}
button:hover{background:#f5f7fa}
button.primary{
  background:#6264A7; /* Microsoft Teams Purple */
  color:#fff;
  border-color:#6264A7
}
button.primary:hover{background:#464775}
button.danger{color:#c62828}

.workspace{
  flex:1;
  min-height:0;
  display:flex
}
.editor-pane,.preview-pane{
  min-width:220px;
  display:flex;
  flex-direction:column;
  overflow:hidden
}
.editor-pane{
  width:52%;
  background:#fff;
  flex:none
}
.preview-pane{
  flex:1;
  background:#e9edf2
}
.pane-head{
  min-height:43px;
  display:flex;
  align-items:center;
  padding:5px 10px;
  border-bottom:1px solid #dfe3e8;
  background:#fafbfc;
  flex:none
}
.tabs{
  display:flex;
  gap:3px
}
.tab{
  border:0;
  border-radius:4px;
  padding:7px 12px;
  background:transparent;
  color:#666
}
.tab.active{
  background:#ece8ff;
  color:#464775;
  font-weight:700
}
.head-tools{
  margin-left:auto;
  display:flex;
  gap:5px;
  align-items:center;
  flex-wrap:wrap
}
.editor-wrap{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden
}
#visualEditor{
  height:100%;
  overflow:auto;
  padding:28px;
  background:#fff;
  outline:none
}
#visualEditor:empty:before{
  content:"팀즈 채널 공유 문서를 입력하세요...";
  color:#aaa
}
#codeEditor{
  display:none;
  width:100%;
  height:100%;
  resize:none;
  border:0;
  outline:0;
  padding:18px;
  background:#15191e;
  color:#e8edf2;
  font:13px/1.55 Consolas,"D2Coding",monospace;
  tab-size:2
}
.preview-frame{
  width:100%;
  height:100%;
  border:0;
  background:#fff
}
.divider{
  width:7px;
  cursor:col-resize;
  background:#d8dde3;
  flex:none
}
.divider:hover{background:#aeb8c4}

.statusbar{
  height:26px;
  background:#fff;
  border-top:1px solid #dfe3e8;
  display:flex;
  align-items:center;
  padding:0 12px;
  font-size:11px;
  color:#777;
  flex:none
}
.statusbar .right{
  margin-left:auto
}

/* 툴바 및 기타 디자인 요소 생략 없이 통합 */
.toolbar{
  display:none;
  position:absolute;
  z-index:40;
  background:#fff;
  border:1px solid #ccd2d8;
  border-radius:7px;
  box-shadow:0 8px 25px rgba(0,0,0,.18);
  padding:8px;
  width:380px
}
.toolbar.show{display:block}
.toolbar-row{
  display:flex;
  gap:5px;
  align-items:center;
  margin-bottom:6px
}
</style>
</head>

<body>

<div class="app">
<header class="topbar">
  <div class="title">Teams HTML 문서 협업기</div>
  <div class="subtitle">채널 실시간 공유 및 편집</div>

  <div class="actions">
    <button id="openBtn">파일 불러오기</button>
    <button id="copyBtn">코드 복사</button>
    <button id="saveBtn" class="primary">채널 저장 / 다운로드</button>
    <input id="fileInput" type="file" accept=".html,.htm,text/html" hidden>
  </div>
</header>

<main class="workspace" id="workspace">
<section class="editor-pane" id="editorPane">
  <div class="pane-head">
    <div class="tabs">
      <button class="tab active" id="visualTab">내용 편집</button>
      <button class="tab" id="codeTab">HTML 코드</button>
    </div>
    <div class="head-tools">
      <button id="formatBtn">서식</button>
      <button id="refreshBtn">새로고침</button>
    </div>
  </div>
  <div class="editor-wrap" id="editorWrap">
    <div id="visualEditor" contenteditable="true"></div>
    <textarea id="codeEditor" spellcheck="false"></textarea>
  </div>
</section>

<div class="divider" id="divider"></div>

<section class="preview-pane">
  <div class="pane-head">
    <strong style="font-size:13px">실시간 미리보기 (채널원 동시 확인용)</strong>
  </div>
  <iframe class="preview-frame" id="preview"></iframe>
</section>
</main>

<footer class="statusbar">
  <span id="status">준비 완료 (팀즈 채널 연동 모드)</span>
  <span class="right">마이크로소프트 팀즈 탭 앱 호환</span>
</footer>
</div>

<script>
  // 기본 인터랙션 및 실시간 프리뷰 동기화 로직
  const visualEditor = document.getElementById('visualEditor');
  const codeEditor = document.getElementById('codeEditor');
  const preview = document.getElementById('preview');
  const status = document.getElementById('status');

  // 탭 전환
  document.getElementById('visualTab').addEventListener('click', () => {
    document.getElementById('visualTab').classList.add('active');
    document.getElementById('codeTab').classList.remove('active');
    visualEditor.style.display = 'block';
    codeEditor.style.display = 'none';
    visualEditor.innerHTML = codeEditor.value;
    updatePreview();
  });

  document.getElementById('codeTab').addEventListener('click', () => {
    document.getElementById('codeTab').classList.add('active');
    document.getElementById('visualTab').classList.remove('active');
    codeEditor.style.display = 'block';
    visualEditor.style.display = 'none';
    codeEditor.value = visualEditor.innerHTML;
  });

  // 실시간 미리보기 업데이트
  function updatePreview() {
    const htmlContent = visualEditor.style.display !== 'none' ? visualEditor.innerHTML : codeEditor.value;
    const doc = preview.contentDocument || preview.contentWindow.document;
    doc.open();
    doc.write(htmlContent);
    doc.close();
  }

  visualEditor.addEventListener('input', () => {
    updatePreview();
    status.innerText = "편집 중...";
  });

  codeEditor.addEventListener('input', () => {
    updatePreview();
    status.innerText = "코드 수정 중...";
  });

  // 파일 열기 및 저장 기능 (팀즈 채널 파일 연동 대비)
  document.getElementById('openBtn').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      visualEditor.innerHTML = evt.target.result;
      codeEditor.value = evt.target.result;
      updatePreview();
      status.innerText = `'${file.name}' 불러오기 완료`;
    };
    reader.readAsText(file, 'utf-8');
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const htmlContent = visualEditor.style.display !== 'none' ? visualEditor.innerHTML : codeEditor.value;
    const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'teams_shared_document.html';
    a.click();
    URL.revokeObjectURL(url);
    status.innerText = "파일이 저장되었습니다. 팀즈 채널에 업로드하여 공유하세요.";
  });

  // 초기 실행
  visualEditor.innerHTML = "<h2>환영합니다!</h2><p>이곳에 작성하는 내용은 팀즈 채널원들과 공유할 수 있는 HTML 문서입니다.</p>";
  updatePrev
</script>
</body>
</html>
