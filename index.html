<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>코드 미리보기</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <div class="app">
    <div class="shared-banner" id="sharedBanner">
      공유된 미리보기입니다. 자유롭게 수정할 수 있어요.
      <button class="btn" id="editSharedBtn">편집 시작</button>
    </div>
    <div class="toolbar">
      <span class="title">코드 미리보기</span>
      <div class="mode-toggle">
        <button id="modeHtml" class="active">HTML</button>
        <button id="modeMarkdown">Markdown</button>
      </div>
      <button class="btn" id="clearBtn">지우기</button>
      <button class="btn primary" id="shareBtn">공유 링크 복사</button>
    </div>
    <div class="panes">
      <div class="pane">
        <div class="pane-header">코드 입력</div>
        <textarea id="editor" spellcheck="false" placeholder="여기에 HTML 또는 Markdown 코드를 붙여넣으세요"></textarea>
      </div>
      <div class="pane">
        <div class="pane-header">미리보기</div>
        <iframe id="previewFrame" sandbox="allow-scripts" title="preview"></iframe>
        <div id="markdownPreview" style="display:none;"></div>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
